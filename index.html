<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is off on purpose. Bones is a drag-and-drop game on a board sized
         to fit the viewport with nothing to scroll, so a pinch or an iOS
         double-tap zoom only ever fires by accident mid-drag — and once zoomed
         the board is half off-screen, which reads as a broken puzzle. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#16241f" />
    <meta name="description" content="Bones — a domino logic puzzle. Fit every tile so each region obeys its rule." />
    <title>Bones</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
